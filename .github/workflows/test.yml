name: Test

on:
  push:
    branches: [feat/ppv-exercise-library]
  pull_request:

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          path: fitvault

      # tsconfig.json's paths resolve @openpay/* against a sibling checkout
      # (../openpay-sdk relative to this repo's root) -- public repo, no
      # token needed.
      - name: Clone openpay-sdk
        run: git clone --branch "${GITHUB_HEAD_REF:-main}" https://github.com/ProgressHQ/openpay-sdk.git openpay-sdk 2>/dev/null || git clone https://github.com/ProgressHQ/openpay-sdk.git openpay-sdk

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fitvault/package-lock.json

      - name: Install dependencies
        working-directory: fitvault
        run: npm ci

      - name: Run tsc --noEmit
        working-directory: fitvault
        run: npx tsc --noEmit

  build:
    name: Next.js build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: fitvault

      - name: Clone openpay-sdk
        run: git clone --branch "${GITHUB_HEAD_REF:-main}" https://github.com/ProgressHQ/openpay-sdk.git openpay-sdk 2>/dev/null || git clone https://github.com/ProgressHQ/openpay-sdk.git openpay-sdk

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fitvault/package-lock.json

      - name: Install dependencies
        working-directory: fitvault
        run: npm ci

      - name: Build
        working-directory: fitvault
        run: npm run build

  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fail on high/critical known-vulnerable dependencies
        run: npm audit --omit=dev --audit-level=high
